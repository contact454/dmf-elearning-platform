# S7-04 / S8-04: Hardened Docker Compose with health checks, resource limits, and network isolation
services:
  postgres:
    image: postgres:16-alpine
    container_name: dmf_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dmf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}
      POSTGRES_DB: dmf_learning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dmf -d dmf_learning" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      - dmf-network

  redis:
    image: redis:7-alpine
    container_name: dmf_redis
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD must be set} --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      - dmf-network

  learning-service:
    build:
      context: ./services/learning-service
      dockerfile: Dockerfile
    container_name: dmf_learning_service
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://dmf:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set}@postgres:5432/dmf_learning
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RATE_LIMIT_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3003/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    networks:
      - dmf-network

  # ─── Web Learner (Next.js Frontend) ───
  web-learner:
    build:
      context: ./apps/web-learner
      dockerfile: Dockerfile
    container_name: dmf_web_learner
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://learning-service:3003/api
    depends_on:
      - learning-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - dmf-network

  # ─── Prometheus (Metrics Scraping) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: dmf_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - learning-service
    restart: unless-stopped
    networks:
      - dmf-network

  # ─── Grafana (Dashboard UI) ───
  grafana:
    image: grafana/grafana:latest
    container_name: dmf_grafana
    ports:
      - '3030:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dmf-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local

networks:
  dmf-network:
    driver: bridge
    name: dmf-network
