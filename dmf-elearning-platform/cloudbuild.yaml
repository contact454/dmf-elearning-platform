# Cloud Build CI/CD Pipeline for DMF E-Learning Platform
# Triggers on push to main → builds Docker image → deploys to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:latest'
      - '-f'
      - 'services/learning-service/Dockerfile'
      - 'services/learning-service'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dmf-learning-service'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '3004'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3004'
      - '--set-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=database-url:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest'

# Build timeout
timeout: '600s'

# Store images in Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:$COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/dmf-elearning/learning-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
