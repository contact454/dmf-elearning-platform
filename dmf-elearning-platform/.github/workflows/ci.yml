name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm build
      
      - name: Test
        run: pnpm test
      
      - name: Start services (non-watch mode for E2E stability)
        run: |
          pnpm dev:e2e &
          echo $! > /tmp/pnpm-dev.pid
      
      - name: Wait for services to be ready
        run: |
          timeout=60
          elapsed=0
          ports=(3001 3002 3003 3004 3005 3006)
          
          while [ $elapsed -lt $timeout ]; do
            all_ready=true
            for port in "${ports[@]}"; do
              if ! curl -f http://localhost:$port/health > /dev/null 2>&1; then
                all_ready=false
                break
              fi
            done
            
            if [ "$all_ready" = true ]; then
              echo "All services are ready"
              exit 0
            fi
            
            echo "Waiting for services... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          
          echo "Services did not become ready within $timeout seconds"
          exit 1
      
      - name: Run E2E tests
        run: pnpm e2e
        timeout-minutes: 5
      
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/pnpm-dev.pid ]; then
            kill $(cat /tmp/pnpm-dev.pid) || true
          fi
          pkill -f "tsx watch" || true
          pkill -f "node.*dist/index.js" || true
