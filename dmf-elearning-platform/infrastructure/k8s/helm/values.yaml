# Default Helm values for dmf-elearning
# M8 S23-03
#
# SECURITY NOTE: Do NOT store plaintext secrets in this file.
# Use one of the following for secrets management:
#   - Sealed Secrets: https://sealed-secrets.netlify.app/
#   - External Secrets Operator: https://external-secrets.io/
#   - SOPS + age/GPG: https://github.com/mozilla/sops
#
# All sensitive values (passwords, API keys, tokens) MUST be stored
# in Kubernetes Secrets and referenced via existingSecret fields.

replicaCount: 2

image:
  repository: ghcr.io/contact454/dmf-learning-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: api.dmf-elearning.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dmf-api-tls
      hosts:
        - api.dmf-elearning.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 10

env:
  NODE_ENV: production
  PORT: "3001"

# All secrets are referenced from K8s Secrets objects.
# Create these secrets using Sealed Secrets or External Secrets Operator:
#
#   kubectl create secret generic dmf-secrets \
#     --from-literal=database-url="$DATABASE_URL" \
#     --from-literal=redis-url="$REDIS_URL" \
#     --from-literal=supabase-jwt-secret="$SUPABASE_JWT_SECRET" \
#     --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
#
# For production, encrypt with Sealed Secrets:
#   kubeseal --format=yaml < secret.yaml > sealed-secret.yaml
envSecrets:
  - name: DATABASE_URL
    secretName: dmf-secrets
    key: database-url
  - name: REDIS_URL
    secretName: dmf-secrets
    key: redis-url
  - name: SUPABASE_JWT_SECRET
    secretName: dmf-secrets
    key: supabase-jwt-secret
  - name: ANTHROPIC_API_KEY
    secretName: dmf-secrets
    key: anthropic-api-key

postgresql:
  enabled: true
  auth:
    database: dmf_learning
    # SECURITY: Password is stored in K8s Secret, NOT in values.yaml
    # Create the secret: kubectl create secret generic dmf-db-secret \
    #   --from-literal=postgres-password="$POSTGRES_PASSWORD" \
    #   --from-literal=password="$POSTGRES_PASSWORD"
    existingSecret: dmf-db-secret
  primary:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
  readReplicas:
    replicaCount: 1
    persistence:
      size: 20Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    # SECURITY: Password is stored in K8s Secret, NOT in values.yaml
    # Create the secret: kubectl create secret generic dmf-redis-secret \
    #   --from-literal=redis-password="$REDIS_PASSWORD"
    existingSecret: dmf-redis-secret
  master:
    persistence:
      size: 5Gi
    resources:
      limits:
        cpu: 250m
        memory: 256Mi

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
