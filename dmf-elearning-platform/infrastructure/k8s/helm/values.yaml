# Default Helm values for dmf-elearning
# M8 S23-03

replicaCount: 2

image:
  repository: ghcr.io/contact454/dmf-learning-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: api.dmf-elearning.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dmf-api-tls
      hosts:
        - api.dmf-elearning.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  NODE_ENV: production
  PORT: "3001"

envSecrets:
  - name: DATABASE_URL
    secretName: dmf-secrets
    key: database-url
  - name: REDIS_URL
    secretName: dmf-secrets
    key: redis-url
  - name: SUPABASE_JWT_SECRET
    secretName: dmf-secrets
    key: supabase-jwt-secret
  - name: ANTHROPIC_API_KEY
    secretName: dmf-secrets
    key: anthropic-api-key

postgresql:
  enabled: true
  auth:
    database: dmf_learning
    existingSecret: dmf-db-secret
  primary:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
  readReplicas:
    replicaCount: 1
    persistence:
      size: 20Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: dmf-redis-secret
  master:
    persistence:
      size: 5Gi
    resources:
      limits:
        cpu: 250m
        memory: 256Mi

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
