# Prometheus Configuration — DMF eLearning
# Scrapes learning-service /metrics endpoint

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dmf-learning-service'
    static_configs:
      - targets: ['learning-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
